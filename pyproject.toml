[project]
name = "so101-demo"
version = "0.1.0"
description = "SO-101 in MuJoCo reproduces a person's pick/place, read from a short video into a contract JSON"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.13.0",
    "placo>=0.9.25",
    "numpy>=2",
    "jsonschema>=4.26.0",
    "pillow>=12.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "markdown>=3.11.2",
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a GPU, vLLM or a display; deselected by default",
]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored upstream code is kept byte-identical apart from the documented change.
extend-exclude = ["src/so101_demo/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Evidence generators hold Markdown templates whose table rows exceed the code width.
"src/so101_demo/evidence/*" = ["E501"]
"src/so101_demo/ui/evidence_*.py" = ["E501"]
